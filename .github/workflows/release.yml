name: Release & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

env:
  CARGO_TERM_COLOR: always

jobs:
  # =========================================================================
  # 1. Verification Gate: Strictly required before ANY build/publish executes
  # =========================================================================
  verify:
    name: Verification Gate (Tests & Quality Checks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Code Formatting Check
        run: cargo fmt --all -- --check

      - name: Clippy Linter Check
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Test Suite (Strictly Sequential Execution)
        run: cargo test -- --test-threads=1

      - name: Validate Cargo Store Packaging (Dry Run)
        run: cargo package --no-verify

  # =========================================================================
  # 2. Publish to Cargo Store (crates.io)
  # =========================================================================
  publish-cargo:
    name: Publish to Cargo Store (crates.io)
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to Crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --token "$CARGO_REGISTRY_TOKEN"

  # =========================================================================
  # 3. Build Multi-Platform Release Binaries (Linux, macOS, Windows)
  # =========================================================================
  build-binaries:
    name: Build Binary (${{ matrix.target }})
    needs: [verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: tern
            archive_ext: tar.gz
          # macOS Apple Silicon (ARM64)
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: tern
            archive_ext: tar.gz
          # macOS Intel (x86_64)
          - os: macos-13
            target: x86_64-apple-darwin
            binary_name: tern
            archive_ext: tar.gz
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: tern.exe
            archive_ext: zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Release Asset (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          RELEASE_DIR="target/${{ matrix.target }}/release"
          ARCHIVE_NAME="tern-${{ matrix.target }}.${{ matrix.archive_ext }}"
          cp README.md LICENSE "$RELEASE_DIR/"
          tar -czvf "$ARCHIVE_NAME" -C "$RELEASE_DIR" ${{ matrix.binary_name }} README.md LICENSE
          shasum -a 256 "$ARCHIVE_NAME" > "$ARCHIVE_NAME.sha256"

      - name: Package Release Asset (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ReleaseDir = "target/${{ matrix.target }}/release"
          $ArchiveName = "tern-${{ matrix.target }}.${{ matrix.archive_ext }}"
          Copy-Item README.md, LICENSE -Destination $ReleaseDir
          Compress-Archive -Path "$ReleaseDir/${{ matrix.binary_name }}", "$ReleaseDir/README.md", "$ReleaseDir/LICENSE" -DestinationPath $ArchiveName
          $Hash = (Get-FileHash -Path $ArchiveName -Algorithm SHA256).Hash.ToLower()
          "$Hash  $ArchiveName" | Out-File -FilePath "$ArchiveName.sha256" -Encoding ascii

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: |
            tern-${{ matrix.target }}.${{ matrix.archive_ext }}
            tern-${{ matrix.target }}.${{ matrix.archive_ext }}.sha256
          retention-days: 1

  # =========================================================================
  # 4. Create GitHub Release
  # =========================================================================
  create-github-release:
    name: Create GitHub Release
    needs: [verify, build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: release-assets

      - name: Determine Release Title
        id: release_title
        shell: bash
        run: |
          TAG="${{ github.ref_name || inputs.tag }}"
          if [[ "$TAG" =~ ^v1\. ]]; then
            echo "title=Little Noddy ($TAG)" >> "$GITHUB_OUTPUT"
          else
            echo "title=$TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.release_title.outputs.title }}
          tag_name: ${{ github.ref_name || inputs.tag }}
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
