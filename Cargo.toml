[package]
name = "tern"
version = "0.1.0"
edition = "2021"
authors = ["Rishi Chinta"]
description = "A CLI tool to spin up DB containers and generate schema diffs"

# Forces the compiled executable to be named "tern"
[[bin]]
name = "tern"
path = "src/main.rs"

[lib]
name = "tern"
path = "src/lib.rs"

[dependencies]
bollard = "0.18"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
hex = "0.4"
inquire = "0.7"
sea-schema = { version = "0.16", default-features = false, features = [
    "discovery",
    "sqlx-postgres",
    "sqlx-mysql",
    "sqlx-sqlite",
    "runtime-tokio-rustls",
] }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
sqlparser = "0.49"
sqlx = { version = "0.8", default-features = false, features = [
    "any",
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "mysql",
    "sqlite",
] }
tokio = { version = "1.40", features = ["full"] }
toml = "0.8"
